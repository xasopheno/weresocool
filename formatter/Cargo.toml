[package]
name = "weresocool_formatter"
version = "2.0.0"
edition = "2024"
authors = ["Danny <weresocool@xasopheno.com>"]
description = "Code formatter for WereSoCool .socool files"
license = "GPL-3.0"

[dependencies]
weresocool_parser = { path = "../parser", version = "^2.0.0" }
weresocool_ast = { path = "../ast", version = "^2.0.0" }
weresocool_error = { path = "../error", version = "^2.0.0" }
pretty = "0.12"
thiserror = "2.0"
num-rational = "0.4"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = ["app"]
app = ["weresocool_parser/app", "weresocool_ast/app", "weresocool_error/app"]
wasm = ["weresocool_parser/wasm", "weresocool_ast/wasm", "weresocool_error/wasm"]
