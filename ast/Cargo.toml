[package]
name = "weresocool_ast"
version = "2.0.0"
authors = ["Danny Meyer <weresocool@xasopheno.com>"]
edition = "2021"
description = "AST for WereSoCool"
license = "GPL-3.0" 
resolver="2"

[dependencies]
weresocool_ring_buffer = { path = "../ring_buffer", version = "^2.0.0" }
weresocool_error = { path = "../error", version = "^2.0.0", default-features=false, optional=true }
weresocool_filter = { path = "../filter", version = "^2.0.0" } 
weresocool_shared = { path = "../shared", version = "^2.0.0" }
scop = { path = "../scop", version = "^2.0.0" }
num-rational = { version = "0.4", features = ["serde"] } 
rand = { version="0.8", features=["std"]}
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
pretty_assertions = "1.4"
indexmap = "2.6"
colored = "2.1"
num-traits = "0.2"
num-integer = "0.1"
polynomials = "0.2"
meval = { git = "https://github.com/xasopheno/meval-rs"}
csv = "1.3"
hamcrest2 = "0.3"
peekread = "0.1"
bimap = "0.6"
colorgrad = "0.7"
dyn-clone = "1.0"
csscolorparser = "0.7"
naga = { version = "25.0", features = ["wgsl-in"] }
minijinja = { version = "2.3", optional = true }
once_cell = "1.20"
weresocool-from-sound = { path = "../../weresocool_from_sound", optional = true, default-features = false }
weresocool_analyze = { path = "../analyze", optional = true }
serde_json = { version = "1.0", optional = true }
bincode = { version = "1.3", optional = true }

[features]
default=["app"]
app=["weresocool_error/app", "from-sound"]
from-sound=["weresocool-from-sound", "weresocool_analyze", "serde_json", "bincode"]
wasm=["weresocool_error/wasm"]
