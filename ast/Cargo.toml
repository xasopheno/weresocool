[package]
name = "weresocool_ast"
version = "1.0.47"
authors = ["Danny Meyer <weresocool@xasopheno.com>"]
edition = "2024"
description = "AST for WereSoCool"
license = "GPL-3.0" 
resolver="2"

[dependencies]
weresocool_ring_buffer = { path = "../ring_buffer", version = "^1.0.47" }
weresocool_error = { path = "../error", version = "^1.0.47", default-features=false, optional=true }
weresocool_filter = { path = "../filter", version = "^1.0.45" } 
weresocool_shared = { path = "../shared", version = "^1.0.47" }
scop = { path = "../scop", version = "^1.0.47" }
num-rational = { version = "0.4", features = ["serde"] } 
rand = { version="0.8", features=["std"]}
serde = { version = "1.0", features = ["derive"] }
pretty_assertions = "1.4"
indexmap = "2.6"
colored = "2.1"
num-traits = "0.2"
num-integer = "0.1"
polynomials = "0.2"
meval = { git = "https://github.com/xasopheno/meval-rs"}
csv = "1.3"
hamcrest2 = "0.3"
peekread = "0.1"
bimap = "0.6"
colorgrad = "0.7"
dyn-clone = "1.0"
csscolorparser = "0.7"
naga = { version = "25.0", features = ["wgsl-in"] }
minijinja = { version = "2.3", optional = true }

[features]
default=["app"]
app=["weresocool_error/app"]
wasm=["weresocool_error/wasm"]
