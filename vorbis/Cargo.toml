vorbis-encoder = "0.1.4"
weresocool_error = { path = "../error", version = "^2.0.0", default-features=false }
weresocool_shared = { path = "../shared", version = "^2.0.0" }

[dev-dependencies]
hamcrest2 = "0.3.0"
