[package]
name = "weresocool_vorbis"
version = "2.0.0"
edition = "2024"
description = "Vorbis for WereSoCool"
license = "GPL-3.0" 
resolver="2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hound = "3.4.0"
