[package]
name = "weresocool_core"
version = "2.0.0"
edition = "2021"
authors = ["Danny <weresocool@xasopheno.com>"]
description = "***** WereSoCool __!Now In Stereo!__ ****** Make cool sounds. Impress your friends."
license = "GPL-3.0" 
autobins = false
repository = "https://github.com/xasopheno/WereSoCool"
keywords = ["microtonal", "binaural", "composition",  "audio", "music"]
categories = ["multimedia::audio"]
readme = "README.md"
resolver="2"

exclude = [
    "renders/*",
    "imgs/*",
]


[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
weresocool_lame = { path = "../lame", version = "^2.0.0", optional = true }

[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dependencies]
weresocool_lame = { path = "../lame", version = "^2.0.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.11", features = ["v4", "js"] }
# Drop-in std::time::Instant that doesn't panic in the browser; used by
# render_manager's pause/vis-ready clock.
web-time = "1"

[dependencies]
scop = { path = "../scop", version = "^2.0.0" }
opmap = { path = "../opmap", version = "^2.0.0" }
weresocool_ring_buffer = { path = "../ring_buffer", version = "^2.0.0" }
weresocool_analyze = { path = "../analyze", version = "^2.0.0" }
weresocool_parser = { path = "../parser", version = "^2.0.0", default-features=false, optional=true }
weresocool_ast = { path = "../ast", version = "^2.0.0", default-features=false, optional=true }
weresocool_error = { path = "../error", version = "^2.0.0", default-features=false, optional=true }
weresocool_instrument = { path = "../instrument", version = "^2.0.0", default-features=false, optional=true }
weresocool_shared = { path = "../shared", version = "^2.0.0" }
weresocool_vorbis = { path = "../vorbis", version = "^2.0.0", optional=true, default-features = false }
weresocool_portaudio = { version = "1.0.47", optional = true, git = "https://github.com/xasopheno/weresocool_portaudio"}
weresocool_events = { path = "../weresocool_events", version = "^2.0.0" }
rand = { version="0.8", features=["std"]}
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_derive = "1.0"
colored = "2.1"
pbr = { version="1.1", optional=true }
num-rational = "0.4"
num-traits = "0.2"
rayon = "1.10"
indexmap = { version = "2.6", features = ["serde"] }
difference = "2.0"
term = "1.0"
uuid = { version = "1.11", features = ["v4"] }
num-complex = "0.4"
num = "0.4"
csv = "1.3"
futures = "0.3"
bytes = "1.8"
env_logger = "0.11"
test-generator = "0.3"
float-cmp = "0.10"
zip = { version="2.2", optional=true }
crossbeam-channel = "0.5"
log = "0.4"
cpal = "0.15"
once_cell = "1.19"

[features]
default=["app"]
app=["weresocool_portaudio", "weresocool_lame",
  "pbr", "zip", "weresocool_error/app",
  "weresocool_parser/app", "weresocool_instrument/app", "weresocool_ast/app"]
windows=[
  "weresocool_portaudio", "weresocool_lame",
  "pbr", "zip", "weresocool_error/app",
  "weresocool_parser/app", "weresocool_instrument/app", "weresocool_ast/app",
  "weresocool_error/windows"
]
wasm = [
  "weresocool_ast/wasm", 
  "weresocool_instrument/wasm", 
  "weresocool_parser/wasm", 
  "weresocool_error/wasm"
]

[dev-dependencies]
pretty_assertions = "1.4"
criterion = "0.5"

[[bench]]
name = "render_bench"
harness = false

